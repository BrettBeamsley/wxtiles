<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WxTiles Comparison</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./compare.css?v=20260603" />
  </head>
  <body>
    <div class="ambient-shape shape-a"></div>
    <div class="ambient-shape shape-b"></div>

    <main class="compare-shell">
      <!-- Control bar at top -->
      <section class="compare-controls">
        <div class="compare-header">
          <h1>WxTiles Comparison</h1>
          <div class="compare-toggles">
            <button id="playBtn" type="button" class="compare-play-btn">Play</button>
            <label for="animationSpeedPreset" class="speed-label">Speed</label>
            <select id="animationSpeedPreset" class="compare-speed-select">
              <option value="slow">Slow</option>
              <option value="normal" selected>Normal</option>
              <option value="fast">Fast</option>
            </select>
            <label><input id="lockVariables" type="checkbox" /> Lock Variables</label>
            <label><input id="lockTimeSteps" type="checkbox" /> Lock Time Steps</label>
          </div>
        </div>
      </section>

      <!-- Three panels -->
      <section class="compare-panels">
        <!-- Panel 1 -->
        <div class="compare-panel">
          <div class="panel-controls">
            <div class="control-group">
              <label for="dataset0">Dataset</label>
              <select id="dataset0"></select>
            </div>
            <div class="control-group">
              <label for="variable0">Variable</label>
              <select id="variable0"></select>
            </div>
            <div class="control-group">
              <label for="timeSelect0">Time</label>
              <select id="timeSelect0"></select>
            </div>
            <div class="panel-warning" id="warning0" aria-live="polite"></div>
          </div>
          <div class="panel-map-wrap">
            <div id="map0" class="compare-map"></div>
            <canvas id="legend0" class="compare-legend" width="200" height="44"></canvas>
          </div>
          <div class="panel-meta">
            <div class="stats mono" id="meta0">dataset=loading...</div>
            <div class="stats mono" id="values0">style=outside source=outside</div>
          </div>
        </div>

        <!-- Panel 2 -->
        <div class="compare-panel">
          <div class="panel-controls">
            <div class="control-group">
              <label for="dataset1">Dataset</label>
              <select id="dataset1"></select>
            </div>
            <div class="control-group">
              <label for="variable1">Variable</label>
              <select id="variable1"></select>
            </div>
            <div class="control-group">
              <label for="timeSelect1">Time</label>
              <select id="timeSelect1"></select>
            </div>
            <div class="panel-warning" id="warning1" aria-live="polite"></div>
          </div>
          <div class="panel-map-wrap">
            <div id="map1" class="compare-map"></div>
            <canvas id="legend1" class="compare-legend" width="200" height="44"></canvas>
          </div>
          <div class="panel-meta">
            <div class="stats mono" id="meta1">dataset=loading...</div>
            <div class="stats mono" id="values1">style=outside source=outside</div>
          </div>
        </div>

        <!-- Panel 3 -->
        <div class="compare-panel">
          <div class="panel-controls">
            <div class="control-group">
              <label for="dataset2">Dataset</label>
              <select id="dataset2"></select>
            </div>
            <div class="control-group">
              <label for="variable2">Variable</label>
              <select id="variable2"></select>
            </div>
            <div class="control-group">
              <label for="timeSelect2">Time</label>
              <select id="timeSelect2"></select>
            </div>
            <div class="panel-warning" id="warning2" aria-live="polite"></div>
          </div>
          <div class="panel-map-wrap">
            <div id="map2" class="compare-map"></div>
            <canvas id="legend2" class="compare-legend" width="200" height="44"></canvas>
          </div>
          <div class="panel-meta">
            <div class="stats mono" id="meta2">dataset=loading...</div>
            <div class="stats mono" id="values2">style=outside source=outside</div>
          </div>
        </div>
      </section>

      <!-- Shared style editor (bottom right, fixed/floated) -->
      <section class="shared-editor">
        <button id="styleToggleBtn" type="button" class="ghost">Custom Style</button>
        <section id="styleEditor" class="editor collapsed">
          <h2>customStyle</h2>

          <div class="control-group">
            <label for="styleJson">json</label>
            <textarea id="styleJson" rows="6" readonly></textarea>
          </div>

          <div class="control-group">
            <label for="fill">fill</label>
            <select id="fill">
              <option value="gradient">gradient</option>
              <option value="solid">solid</option>
              <option value="none">none</option>
            </select>
          </div>

          <div class="grid-two">
            <div class="control-group">
              <label for="isolineColorMode">isolineColor</label>
              <select id="isolineColorMode">
                <option value="inverted">inverted</option>
                <option value="fill">fill</option>
                <option value="none">none</option>
                <option value="custom">custom</option>
              </select>
            </div>
            <div class="control-group">
              <label for="isolineColorCustom">isolineColorCustom</label>
              <input id="isolineColorCustom" type="color" value="#000000" />
            </div>
          </div>

          <div class="grid-two toggles">
            <label><input id="isolineText" type="checkbox" checked /> isolineText</label>
          </div>

          <div class="control-group">
            <label for="vectorType">vectorType</label>
            <select id="vectorType">
              <option value="arrows">arrows</option>
              <option value="barbs">barbs</option>
              <option value="none">none</option>
            </select>
          </div>

          <div class="grid-two">
            <div class="control-group">
              <label for="vectorColorMode">vectorColor</label>
              <select id="vectorColorMode">
                <option value="inverted">inverted</option>
                <option value="fill">fill</option>
                <option value="none">none</option>
                <option value="custom">custom</option>
              </select>
            </div>
            <div class="control-group">
              <label for="vectorColorCustom">vectorColorCustom</label>
              <input id="vectorColorCustom" type="color" value="#000000" />
            </div>
          </div>

          <div class="control-group">
            <label for="vectorFactor">vectorFactor</label>
            <input id="vectorFactor" type="number" min="0.1" max="10" step="0.1" value="1" />
          </div>

          <div class="grid-two">
            <div class="control-group">
              <label for="streamLineColorMode">streamLineColor</label>
              <select id="streamLineColorMode">
                <option value="inverted">inverted</option>
                <option value="fill">fill</option>
                <option value="none">none</option>
                <option value="custom">custom</option>
              </select>
            </div>
            <div class="control-group">
              <label for="streamLineColorCustom">streamLineColorCustom</label>
              <input id="streamLineColorCustom" type="color" value="#000000" />
            </div>
          </div>

          <div class="control-group">
            <label for="streamLineSpeedFactor">streamLineSpeedFactor</label>
            <input id="streamLineSpeedFactor" type="range" min="0.1" max="10" step="0.1" value="1" />
          </div>

          <div class="grid-two toggles">
            <label><input id="streamLineStatic" type="checkbox" /> streamLineStatic</label>
            <label><input id="showBelowMin" type="checkbox" checked /> showBelowMin</label>
            <label><input id="showAboveMax" type="checkbox" checked /> showAboveMax</label>
          </div>

          <div class="control-group">
            <label for="colorScheme">colorScheme</label>
            <select id="colorScheme"></select>
          </div>

          <div id="palettePreview" class="palette-preview"></div>

          <div class="control-group">
            <label for="colors">colors</label>
            <input id="colors" type="text" placeholder='["#0000ffff", "#00ffffff", "#ff0000ff"]' />
          </div>

          <div class="control-group">
            <label for="colorMap">colorMap</label>
            <input id="colorMap" type="text" placeholder='[[0, "#0000ff"], [20, "#ff0000"]]' />
          </div>

          <div class="control-group">
            <label for="levels">levels</label>
            <input id="levels" type="text" placeholder='[0,5,10,15,20]' />
          </div>

          <div class="control-group">
            <label for="blurRadius">blurRadius</label>
            <input id="blurRadius" type="range" min="0" max="10" step="1" value="0" />
          </div>

          <div class="control-group">
            <label for="addDegrees">addDegrees</label>
            <input id="addDegrees" type="number" min="0" max="360" step="1" value="0" />
          </div>

          <div class="control-group">
            <label for="units">units</label>
            <select id="units"></select>
          </div>

          <div class="control-group">
            <label for="mask">mask</label>
            <select id="mask">
              <option value="none">none</option>
              <option value="sea">sea</option>
              <option value="land">land</option>
            </select>
          </div>

          <div class="control-group">
            <label for="glAnimationSpeed">animationSpeed</label>
            <input id="glAnimationSpeed" type="range" min="0.1" max="10" step="0.1" value="1" />
          </div>

          <div class="control-group">
            <label for="glNoiseTexturePow">noiseTexturePow</label>
            <input id="glNoiseTexturePow" type="range" min="5" max="8" step="1" value="5" />
          </div>

          <div class="control-group">
            <label for="glVectorFieldFactor">vectorFieldFactor</label>
            <input id="glVectorFieldFactor" type="range" min="0.1" max="3" step="0.1" value="1" />
          </div>

          <div class="control-group">
            <label for="glAnimationIntensity">animationIntensity</label>
            <input id="glAnimationIntensity" type="range" min="0.1" max="10" step="0.1" value="5" />
          </div>

          <div class="control-group">
            <label for="glWavesCount">wavesCount</label>
            <input id="glWavesCount" type="range" min="2" max="10" step="1" value="4" />
          </div>
        </section>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./compare.js"></script>
  </body>
</html>
